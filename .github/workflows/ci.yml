# 持续集成：push / PR 时跑「构建 + 单元测试 + 打包 + 许可头检查」。
#
# 刻意不跑 `mvn verify`：集成测试（*IT）需要可达的 MySQL 与非空 token（见
# docs/QUICKSTART.md §2），CI 基线保持「零外部依赖可绿」——它拦的是编译、
# 单元/切片测试、打包、许可头这类提交即能发现的问题（先例：曾有两个新测试文件
# 缺许可头、无 CI 拦截而溜进主干，事后由 license:check 抓出）。
# 接口/签名变更后的本地验证仍应 `mvn -B clean verify`（见 docs/CODE-VS-SPEC.md §5）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit tests & package
        run: mvn -B package

      - name: License header check
        run: mvn -B license:check
