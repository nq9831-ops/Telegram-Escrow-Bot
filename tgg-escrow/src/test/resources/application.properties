# 持久化测试：H2 跑 MySQL 兼容模式，验证 Flyway 迁移与 JPA 映射一致。
# ddl-auto=validate 是关键——实体与 V1 DDL 对不上会在启动期就失败，而非运行时炸。
spring.datasource.url=jdbc:h2:mem:escrow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
