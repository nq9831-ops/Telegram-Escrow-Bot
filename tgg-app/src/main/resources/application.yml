spring:
  application:
    name: telegram-escrow-bot

  datasource:
    # 生产值经环境变量注入（与参考项目的纪律一致：密钥不硬编码，缺失即 fail-fast）。
    url: jdbc:mysql://${TGG_DB_HOST:localhost}:${TGG_DB_PORT:3306}/${TGG_DB_NAME:tgg_escrow}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${TGG_DB_USER:root}
    password: ${TGG_DB_PASSWORD:}

  jpa:
    # validate：数据库结构由 Flyway 管理，实体不许自行建表/改表。
    # 结构漂移在启动期即失败，而不是运行到某条 SQL 才炸。
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# Bot 与交易链参数（部署者按需覆盖；此处默认值仅为示例，不构成建议）。
# token 刻意不在此处——只从环境变量 TELEGRAM_BOT_TOKEN 读（BotTokenConfig），避免凭证进仓库。
tgg:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:nq9831ops_bot}
  trade:
    concurrent-max: ${TGG_TRADE_CONCURRENT_MAX:1}
    cooldown: ${TGG_TRADE_COOLDOWN:PT0S}
    tier:
      normal-max: ${TGG_TIER_NORMAL_MAX:100}
      confirm-max: ${TGG_TIER_CONFIRM_MAX:1000}
  pending:
    ttl: ${TGG_PENDING_TTL:PT10M}
  invite:
    # 邀请有效期：对方须在此期限内点开链接接单，否则失效（惰性过期校验）
    ttl: ${TGG_INVITE_TTL:PT24H}
  webapp:
    # Mini App 表单页地址（必须 HTTPS——Telegram 硬性要求）。留空则「用法/帮助」回执退化为
    # 纯文本、不带「打开表单」按钮。
    url: ${TGG_WEBAPP_URL:}
    initdata:
      # initData 验签允许的最大时延（防重放）
      max-age: ${TGG_WEBAPP_INITDATA_MAX_AGE:PT1H}

logging:
  level:
    root: INFO
